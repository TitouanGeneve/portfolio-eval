    <main>
      <section class="paragraphe" id="photographie">
        <p class="eyebrow">En dehors du code</p>
        <h1>Mes photos</h1>
        <p class="section-intro">
          Quelques paysages, animaux et voitures photographiés au fil de mes
          sorties.
        </p>
        <!-- Galerie de photos ; loading="lazy" diffère le chargement des images -->
        <div class="photos-grid">
          <figure class="photo">
            <img
              class="image-photo"
              src="../assets/img/1.webp"
              alt="Porsche photographiée"
              loading="lazy"
            />
            <figcaption class="description-photo">Porsche</figcaption>
          </figure>
          <figure class="photo">
            <img
              class="image-photo"
              src="../assets/img/2.webp"
              alt="Éclipse photographiée"
              loading="lazy"
            />
            <figcaption class="description-photo">Éclipse</figcaption>
          </figure>
          <figure class="photo">
            <img
              class="image-photo"
              src="../assets/img/3.webp"
              alt="Annonay pendant un orage"
              loading="lazy"
            />
            <figcaption class="description-photo">Annonay par temps d'orage</figcaption>
          </figure>
          <figure class="photo">
            <img
              class="image-photo"
              src="../assets/img/4.webp"
              alt="Papillon zygène posé sur une fleur de carline blanche"
              loading="lazy"
            />
            <figcaption class="description-photo">
              Papillon zygène sur une carline blanche
            </figcaption>
          </figure>
          <figure class="photo">
